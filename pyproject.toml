[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gddes"
version = "1.0.0"
description = "Gynaecological Disease Diagnosis Expert System (GDDES) using Machine Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Khem Raj Bajgain", email = "heykhemraj@gmail.com" }
]
keywords = [
    "gynaecology",
    "healthcare",
    "machine-learning",
    "pcos-diagnosis",
    "uti-detection",
    "random-forest",
    "django",
    "expert-system"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Framework :: Django :: 4.2",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent"
]
dependencies = [
    "Django>=4.2.16,<5.0",
    "scikit-learn>=1.3.2,<1.4",
    "numpy>=1.26.4,<2.0",
    "pandas>=2.1.4,<3.0",
    "joblib>=1.4.2",
    "nltk>=3.8.1",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.2.4"
]

[project.urls]
Homepage = "https://github.com/gemkhem/AI-Based-Gynecological-Disease-Diagnosis-System"
Repository = "https://github.com/gemkhem/AI-Based-Gynecological-Disease-Diagnosis-System.git"
Issues = "https://github.com/gemkhem/AI-Based-Gynecological-Disease-Diagnosis-System/issues"
Releases = "https://github.com/gemkhem/AI-Based-Gynecological-Disease-Diagnosis-System/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["fron-end*"]
